spring.application.name=foreigncurrencyexchangetask


spring.datasource.url = jdbc:postgresql://localhost:5432/zettafxtask
spring.datasource.username = postgres
spring.datasource.password = testpassword123
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.hibernate.ddl-auto = update


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#Flyway configurations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# FX Providers
fx.provider.base-url=${FX_PROVIDER_BASE_URL:https://api.frankfurter.app}